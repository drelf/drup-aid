# The AI brain (cloud provider / optional n8n) and the agent display name live
# centrally in drupaid_core.settings. This module only configures the support
# desk behaviour.
rate_limit_max: 20
rate_limit_window: 3600
ticket_auto_create: true
ticket_node_type: page
fallback_response: "I'm sorry, I'm having trouble connecting right now. Please try again in a moment, or <a href='/ticket'>open a ticket</a> and we'll get back to you shortly."
demo_gate_enabled: false
demo_access_code: ''
session_retention_days: 30
