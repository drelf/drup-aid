<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="Drup-AID logo">
  <title>Drup-AID — the AI-Designed flavor of Drupal</title>
  <defs>
    <radialGradient id="dropGrad" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#37b0ef"/>
      <stop offset="100%" stop-color="#0678BE"/>
    </radialGradient>
    <radialGradient id="splashGrad" cx="42%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#ff2f51"/>
      <stop offset="100%" stop-color="#E4002B"/>
    </radialGradient>
    <style>
      .word{font-family:'Arial Rounded MT Bold','Trebuchet MS',Verdana,sans-serif;font-weight:900;}
      .tag{font-family:'Trebuchet MS',Verdana,sans-serif;font-weight:700;}
    </style>
  </defs>

  <!-- ===== RED SPLASH (Kool-Aid homage) ===== -->
  <g>
    <ellipse cx="620" cy="225" rx="300" ry="180" fill="url(#splashGrad)"/>
    <circle cx="922" cy="150" r="26" fill="#E4002B"/>
    <circle cx="952" cy="232" r="15" fill="#E4002B"/>
    <circle cx="888" cy="330" r="21" fill="#E4002B"/>
    <circle cx="332" cy="138" r="16" fill="#E4002B"/>
    <circle cx="344" cy="352" r="22" fill="#E4002B"/>
    <path d="M560,398 q13,55 0,70 q-13,-15 0,-70 Z" fill="#E4002B"/>
    <path d="M700,402 q11,42 0,55 q-11,-13 0,-55 Z" fill="#E4002B"/>
  </g>

  <!-- ===== WORDMARK ===== -->
  <g transform="rotate(-3 620 225)">
    <text x="620" y="240" text-anchor="middle" class="word" font-size="106"
          fill="#ffffff" stroke="#7d0016" stroke-width="10" paint-order="stroke"
          stroke-linejoin="round">Drup-AID</text>
    <text x="620" y="305" text-anchor="middle" class="tag" font-size="25"
          fill="#ffffff" letter-spacing="1">the AI-Designed flavor of Drupal</text>
  </g>

  <!-- ===== MASCOT: grinning Drupal drop (Druplicon x Kool-Aid Man) ===== -->
  <g>
    <path d="M215,238 C 245,205 262,188 278,168" fill="none" stroke="#0678BE"
          stroke-width="26" stroke-linecap="round"/>
    <circle cx="283" cy="162" r="28" fill="#ffffff" stroke="#045a8c" stroke-width="4"/>
    <path d="M150,140 C 198,202 232,240 232,292 A 82,82 0 1 1 68,292 C 68,240 102,202 150,140 Z"
          fill="url(#dropGrad)" stroke="#045a8c" stroke-width="5"/>
    <circle cx="104" cy="304" r="14" fill="#ff7a8a" opacity="0.55"/>
    <circle cx="196" cy="304" r="14" fill="#ff7a8a" opacity="0.55"/>
    <circle cx="127" cy="272" r="17" fill="#ffffff" stroke="#045a8c" stroke-width="3"/>
    <circle cx="173" cy="272" r="17" fill="#ffffff" stroke="#045a8c" stroke-width="3"/>
    <circle cx="132" cy="275" r="7.5" fill="#0a1a2a"/>
    <circle cx="178" cy="275" r="7.5" fill="#0a1a2a"/>
    <path d="M108,308 Q150,366 192,308 Z" fill="#ffffff" stroke="#045a8c"
          stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- ===== "OH YEAH!" burst ===== -->
  <g transform="rotate(-10 232 78)">
    <ellipse cx="232" cy="78" rx="82" ry="38" fill="#FFD200" stroke="#E4002B" stroke-width="5"/>
    <text x="232" y="89" text-anchor="middle" class="word" font-size="32" fill="#E4002B">OH YEAH!</text>
  </g>
</svg>
